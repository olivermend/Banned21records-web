name: B21 media source connectivity probe
on:
  push:
    paths:
      - '.github/workflows/b21-source-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test public image access from CI
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json
          urls={
            "Unsplash concert":"https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=1000&q=82",
            "Unsplash vocalist":"https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=1000&q=82",
            "Flickr Duran 2005 oembed":"https://www.flickr.com/services/oembed/?url="+urllib.parse.quote("https://www.flickr.com/photos/70142054@N00/8712520/")+"&format=json",
            "Flickr Freddie 1977 oembed":"https://www.flickr.com/services/oembed/?url="+urllib.parse.quote("https://www.flickr.com/photos/43547797@N00/257193818/")+"&format=json",
            "Flickr Oakey 2014 oembed":"https://www.flickr.com/services/oembed/?url="+urllib.parse.quote("https://www.flickr.com/photos/archangel12/14699647471/")+"&format=json",
            "Flickr Madonna 1990 oembed":"https://www.flickr.com/services/oembed/?url="+urllib.parse.quote("https://www.flickr.com/photos/alan-light/1919980224/")+"&format=json",
            "Wikimedia CDN":"https://upload.wikimedia.org/wikipedia/commons/1/1e/Sex_Pistols_in_Paradiso.jpg"
          }
          for name,url in urls.items():
            try:
              r=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=14)
              data=r.read(1200)
              print(name,"OK",r.status,r.headers.get('content-type'),r.geturl()[:140],data[:80],flush=True)
            except Exception as e:print(name,"ERROR",str(e),flush=True)
          PY
