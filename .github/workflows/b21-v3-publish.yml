name: B21 Editorial November 2026 v3
on:
  push:
    paths:
      - '.github/workflows/b21-v3-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {slug: sex, file: '1/1e/Sex_Pistols_in_Paradiso.jpg'}
          - {slug: madonna, file: '5/53/MadonnaVirginTour.jpg'}
          - {slug: duran, file: 'f/f6/Duran_Duran.jpg'}
          - {slug: freddie, file: '0/02/Queen_-_Freddie_Mercury.jpg'}
          - {slug: human, file: '6/67/Philip_Oakey_2014.jpg'}
    steps:
      - name: Archive reference image
        env:
          SLUG: ${{ matrix.slug }}
          SOURCE_FILE: ${{ matrix.file }}
        run: |
          python - <<'PY'
          import os,urllib.request,time,pathlib
          d=pathlib.Path('source-cache')
          d.mkdir(exist_ok=True)
          url='https://upload.wikimedia.org/wikipedia/commons/'+os.environ['SOURCE_FILE']
          for k in range(5):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=45) as r: b=r.read()
              assert len(b)>5000 and b[:2]==bytes([255,216])
              (d/(os.environ['SLUG']+'.jpg')).write_bytes(b)
              break
            except Exception:
              if k==4:raise
              time.sleep(10*(k+1))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b21-photo-${{ matrix.slug }}
          path: source-cache/${{ matrix.slug }}.jpg
          retention-days: 1
  build:
    runs-on: ubuntu-latest
    needs: photos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: b21-photo-*
          path: /tmp/b21-editorial-sources
          merge-multiple: true
      - name: Install typography and image packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core
          python -m pip install pillow==11.3.0 numpy==2.3.3
      - name: Prepare and render separate artworks
        env:
          B21_CACHE_DIR: /tmp/b21-editorial-sources
          B21_OUTPUT: assets/social/editorial-2026/b21-nov-2026-v3
        run: |
          python operations/patch_b21_editorial_v3_ci.py
          python operations/generate-b21-nov-editorial-v3.py
      - name: Verify individual dimensions and counts
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          d=Path('assets/social/editorial-2026/b21-nov-2026-v3')
          files=list(d.glob('*.jpg'))
          for p in files:
            if p.name.startswith('_'):continue
            with Image.open(p) as im:
              assert im.size in [(1080,1350),(1080,1920)],(p.name,im.size)
          assert len([p for p in files if not p.name.startswith('_')])==17
          print('QA PASS: 15 carousel JPGs and 2 story JPGs')
          PY
      - name: Deliver public files for Metricool import
        run: |
          git config user.name "b21-editorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/social/editorial-2026/b21-nov-2026-v3
          git commit -m "Publish separate B21 November social artwork"
          git pull --rebase origin main
          git push origin main
