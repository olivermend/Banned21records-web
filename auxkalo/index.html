<script>
(function(){
  const allowed=['en','es','eu'];
  const requested=new URLSearchParams(location.search).get('lang');
  let code=allowed.includes(requested)?requested:null;
  try{if(!code){const saved=localStorage.getItem('b21-language');if(allowed.includes(saved))code=saved}}catch(e){}
  if(!code){const locale=(navigator.language||'es').toLowerCase();code=locale.startsWith('eu')?'eu':locale.startsWith('en')?'en':'es'}
  location.replace('./'+code+'/'+location.hash);
})();
</script>
