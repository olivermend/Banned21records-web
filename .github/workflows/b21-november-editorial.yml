name: B21 November editorial assets
on:
  push:
    paths:
      - '.github/workflows/b21-november-editorial.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow==11.3.0 numpy==2.3.3
      - name: Render five B21 November editorial posts
        run: python operations/generate-b21-nov-editorial.py
      - name: Publish JPEGs to B21 Cloudflare site
        run: |
          git config user.name "b21-editorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/social/editorial-2026/b21-nov-2026
          if ! git diff --cached --quiet; then
            git commit -m "Publish November 2026 B21 social artwork"
            git push
          fi
